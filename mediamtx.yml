# Low-latency MediaMTX config for the Pi 5 -> RTSP -> ffplay pipeline.
#
# MediaMTX fills in anything not listed here with its own compiled-in
# defaults, so this file only overrides the settings that actually matter
# for buffering/latency on this deployment. See MediaMTX's full reference
# mediamtx.yml (the one that ships with the binary) for every other key and
# its explanation.

logLevel: warn
logDestinations: [stdout]

###############################################
# RTSP: the only protocol this deployment needs

rtsp: true
rtspAddress: :8554
rtspEncryption: "no"
# TCP only, both ways. streamer.py's ffmpeg publisher already pushes over
# TCP (its "-rtsp_transport tcp") specifically because UDP made MediaMTX
# remux oversized RTP packets and drop some, which showed up as corrupted
# macroblocks in the viewer. Only offering TCP to readers gives them the
# same guarantee - point ffplay at this server with "-rtsp_transport tcp"
# too (see the test command).
rtspTransports: [tcp]

# Fail fast rather than sit on a stalled socket: a dead publisher or a
# reader that stops reading should not hold buffered frames while the
# server waits around to notice.
readTimeout: 5s
writeTimeout: 5s

# Default is 512 outgoing packets queued per connection - real buffering:
# worst case that is over a second of 720p video sitting behind a slow
# reader before anything gets dropped. Cut hard here since low latency is
# the point of this deployment; must stay a power of two. Raise it back up
# if real network jitter starts causing write failures instead.
writeQueueSize: 64

###############################################
# Everything else off - fewer protocols running means fewer places for
# buffering to creep in, and one less thing to reason about.

rtmp: false
hls: false
webrtc: false
srt: false
moq: false
api: false
metrics: false
pprof: false
playback: false

###############################################
# The one path in use

paths:
  cam:
    source: publisher
    record: false
    sourceOnDemand: false